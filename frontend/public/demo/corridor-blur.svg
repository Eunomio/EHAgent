<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">严重模糊的走廊演示素材</title><desc id="desc">整幅走廊画面经过强烈模糊处理，无法判断是否存在风险</desc>
  <defs><filter id="blur"><feGaussianBlur stdDeviation="24"/></filter><linearGradient id="floor3" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cabda8"/><stop offset="1" stop-color="#8e7b61"/></linearGradient></defs>
  <g filter="url(#blur)"><rect width="800" height="500" fill="#c8cfca"/><path d="M0 500 250 175h300L800 500Z" fill="url(#floor3)"/><rect x="0" width="190" height="500" fill="#afb8b2"/><rect x="610" width="190" height="500" fill="#adb6b0"/><rect x="345" y="310" width="180" height="150" fill="#9a6336"/></g><rect width="800" height="500" fill="#53616a" opacity=".28"/><circle cx="400" cy="280" r="88" fill="#8d4d20" opacity=".9"/><text x="400" y="310" text-anchor="middle" fill="white" font-family="sans-serif" font-size="88" font-weight="800">?</text>
  <rect x="28" y="28" width="330" height="62" rx="14" fill="#75401c" opacity=".94"/><text x="54" y="69" fill="white" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700">拒判：画面清晰度不足</text>
</svg>
