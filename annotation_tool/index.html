<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C6c 图片标注</title>
  <style>
    :root { color-scheme:light; --ink:#17212b; --muted:#65717d; --line:#dce2e8; --accent:#1769e0; --bg:#f5f7fa; --good:#168353; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
    button,select,input,textarea { font:inherit; }
    header { height:58px; padding:0 22px; display:flex; align-items:center; gap:18px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:3; }
    h1 { font-size:18px; margin:0; } .progress { color:var(--muted); } .progress strong { color:var(--good); }
    .toolbar { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .nav-link { color:#0757bd; text-decoration:none; border:1px solid #9ab9df; border-radius:7px; padding:7px 11px; }
    button { border:1px solid #c9d1da; background:#fff; border-radius:7px; padding:8px 13px; cursor:pointer; }
    button:hover { border-color:#8fa1b4; } button.primary { color:#fff; border-color:var(--accent); background:var(--accent); } button:disabled { opacity:.45; cursor:default; }
    main { display:grid; grid-template-columns:minmax(480px,1.45fr) minmax(390px,.85fr); gap:16px; padding:16px; min-height:calc(100vh - 58px); }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .viewer { display:grid; grid-template-rows:auto 1fr; min-height:680px; }
    .viewer-head { padding:12px 15px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; }
    .filename { font-weight:600; word-break:break-all; } .meta { color:var(--muted); font-size:12px; margin-top:3px; }
    .image-wrap { min-height:0; background:#20252b; display:flex; align-items:center; justify-content:center; position:relative; }
    .image-wrap img { max-width:100%; max-height:calc(100vh - 145px); object-fit:contain; }
    .done-badge { display:none; position:absolute; top:12px; right:12px; color:#fff; background:var(--good); padding:5px 9px; border-radius:20px; }
    .done-badge.show { display:block; }
    form { padding:16px; overflow:auto; max-height:calc(100vh - 90px); }
    fieldset { border:0; padding:0; margin:0 0 17px; } legend,label.title { display:block; font-weight:650; margin-bottom:8px; }
    .hint { color:var(--muted); font-size:12px; font-weight:400; }
    .choices { display:flex; flex-wrap:wrap; gap:7px; } .choices input { position:absolute; opacity:0; pointer-events:none; }
    .choices label { border:1px solid #ccd4dd; border-radius:7px; padding:7px 11px; cursor:pointer; user-select:none; }
    .choices input:checked + label { color:#0757bd; border-color:#5a9bf0; background:#eaf3ff; box-shadow:inset 0 0 0 1px #5a9bf0; }
    select,textarea { width:100%; border:1px solid #cbd4dd; border-radius:7px; background:#fff; padding:9px 10px; } textarea { resize:vertical; min-height:70px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .baseline-preview { display:flex; gap:10px; align-items:center; margin-top:8px; color:var(--muted); font-size:12px; }
    .baseline-preview img { width:96px; height:54px; object-fit:cover; border-radius:5px; background:#222; }
    .derived { margin:4px 0 17px; padding:12px 14px; border:1px solid #b9d5f5; border-radius:8px; background:#eef6ff; }
    .derived strong { color:#0757bd; font-size:16px; }
    .footer-actions { position:sticky; bottom:-16px; margin:16px -16px -16px; padding:12px 16px; border-top:1px solid var(--line); background:#fff; display:flex; gap:8px; align-items:center; }
    #message { color:var(--muted); margin-right:auto; max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } #message.error { color:#bb2525; }
    .empty { grid-column:1/-1; padding:60px 25px; text-align:center; color:var(--muted); }
    @media (max-width:900px) { main { grid-template-columns:1fr; } .viewer { min-height:400px; } form { max-height:none; } .image-wrap img { max-height:65vh; } }
  </style>
</head>
<body>
  <header>
    <h1>C6c 图片标注</h1>
    <div class="progress">第 <span id="position">0</span> 张 / 共 <span id="total">0</span> 张 · 已完成 <strong id="completed">0</strong> 张</div>
    <div class="toolbar"><a class="nav-link" href="/walkway">设置过道区域</a><label><input type="checkbox" id="unlabeledOnly"> 只看未标注</label><button type="button" id="previous">上一张</button><button type="button" id="next">下一张</button></div>
  </header>
  <main id="workspace">
    <section class="card viewer">
      <div class="viewer-head"><div><div class="filename" id="filename">正在读取图片…</div><div class="meta" id="metadata"></div></div></div>
      <div class="image-wrap"><img id="currentImage" alt="当前待标注图片"><span class="done-badge" id="doneBadge">已标注</span></div>
    </section>
    <section class="card">
      <form id="form">
        <fieldset><label class="title" for="baseline">畅通基准图</label><select id="baseline" required></select><div class="baseline-preview"><img id="baselineImage" alt="畅通基准图"><span id="baselineName"></span></div></fieldset>
        <div class="grid2"><fieldset><label class="title" for="lighting">光线</label><select id="lighting"></select></fieldset><fieldset><legend>画面质量</legend><div class="choices" id="visibility"></div></fieldset></div>
        <fieldset><legend>是否存在障碍物</legend><div class="choices" id="presence"></div></fieldset>
        <fieldset><legend>障碍物类型 <span class="hint">可多选；确认有障碍物时至少选择一种</span></legend><div class="choices" id="hazards"></div></fieldset>
        <fieldset><legend>物品所在区域</legend><div class="choices" id="positionZone"></div></fieldset>
        <div class="grid2"><fieldset><legend>横向占用过道宽度 <span class="hint">影响剩余可通行宽度</span></legend><div class="choices" id="occupation"></div></fieldset><fieldset><legend>纵向占用过道长度 <span class="hint">沿行走方向持续多长</span></legend><div class="choices" id="lengthOccupation"></div></fieldset></div>
        <div class="grid2"><fieldset><legend>对通行的实际影响</legend><div class="choices" id="passageEffect"></div></fieldset><fieldset><legend>绊倒风险</legend><div class="choices" id="tripRisk"></div></fieldset></div>
        <div class="derived">系统自动计算：<strong id="derivedRisk">—</strong> · <span id="derivedAction">—</span></div>
        <fieldset><label class="title" for="reason">判断依据 <span class="hint">简短写明物品、位置或画面质量</span></label><textarea id="reason" maxlength="200" required placeholder="例如：纸箱位于走道中部，经过时需要绕开。"></textarea></fieldset>
        <div class="footer-actions"><span id="message">Ctrl + S 保存</span><button type="button" id="save">保存</button><button type="submit" class="primary">保存并下一张</button></div>
      </form>
    </section>
  </main>
  <script>
    const options={lighting:{day:'白天',light:'开灯',dim:'偏暗',night:'夜间',night_ir:'红外夜视',backlight:'背光',unknown:'未知'},visibility:{usable:'清晰可判断',limited:'有限但可判断',insufficient:'无法判断'},presence:{present:'有障碍物',none:'无障碍物',unknown:'无法确认'},hazards:{box:'箱子',bag:'袋子',shoe:'鞋',stool:'凳子',cable:'电线',other_obstacle:'其他杂物'},positionZone:{outside:'走道外',boundary:'边界处',inner_side:'过道内侧',center:'行走路线中央',unknown:'无法判断'},occupation:{none:'没有占用',under_quarter:'少于 1/4',quarter_to_half:'1/4 至 1/2',over_half:'超过 1/2',unknown:'无法判断'},passageEffect:{none:'没有影响',narrowed:'通道变窄',detour:'需要绕开',difficult:'通行困难',blocked:'基本堵塞',unknown:'无法判断'},tripRisk:{none:'没有',possible:'潜在风险',obvious:'明显风险',unknown:'无法判断'},risk:{clear:'畅通',low:'低风险',medium:'中风险',high:'高风险',insufficient:'无法判断'},action:{record_clear:'记录畅通',recheck:'稍后复查',create_task:'生成整理待办',remind_resident:'立即提醒'}};
    const state={all:[],visible:[],annotations:{},index:0,output:''}; const el=id=>document.getElementById(id);
    function makeChoices(container,name,values,multiple=false){el(container).innerHTML=Object.entries(values).map(([value,label],i)=>`<input id="${name}-${i}" name="${name}" type="${multiple?'checkbox':'radio'}" value="${value}"><label for="${name}-${i}">${label}</label>`).join('');}
    function selected(name){return document.querySelector(`input[name="${name}"]:checked`)?.value;}
    function setSelected(name,value){document.querySelectorAll(`input[name="${name}"]`).forEach(x=>x.checked=Array.isArray(value)?value.includes(x.value):x.value===value);}
    function current(){return state.visible[state.index];}
    function baselineCandidates(item){const sameCamera=state.all.filter(x=>x.is_baseline&&x.camera_id===item.camera_id);const sameLight=sameCamera.filter(x=>x.lighting===item.lighting);return sameLight.length?sameLight:(sameCamera.length?sameCamera:state.all.filter(x=>x.is_baseline));}
    function defaultBaseline(item){if(item.is_baseline)return item.image_path;return baselineCandidates(item)[0]?.image_path||state.all[0]?.image_path||'';}
    function escapeHtml(text){const node=document.createElement('div');node.textContent=text;return node.innerHTML;}
    function show(){const item=current();if(!item){el('workspace').innerHTML='<div class="card empty">没有可标注的图片。请先采集图片，或关闭“只看未标注”。</div>';updateProgress();return;}el('filename').textContent=item.filename;el('metadata').textContent=[item.camera_id,item.captured_at,item.scene].filter(Boolean).join(' · ');el('currentImage').src=item.image_url;const annotation=state.annotations[item.image_path];el('doneBadge').classList.toggle('show',Boolean(annotation));el('lighting').value=annotation?.lighting||item.lighting||'unknown';setSelected('visibility',annotation?.visibility||'usable');const defaultPresence=item.is_baseline?'none':'present';const presence=annotation?(annotation.hazard_present===true?'present':annotation.hazard_present===false?'none':'unknown'):defaultPresence;setSelected('hazard_present',presence);setSelected('hazard_types',annotation?.hazard_types||[]);setSelected('position_zone',annotation?.position_zone||(presence==='none'?'outside':'boundary'));setSelected('walkway_occupation',annotation?.walkway_occupation||(presence==='none'?'none':'under_quarter'));setSelected('walkway_length_occupation',annotation?.walkway_length_occupation||(presence==='none'?'none':'unknown'));setSelected('passage_effect',annotation?.passage_effect||(presence==='none'?'none':'narrowed'));setSelected('trip_risk',annotation?.trip_risk||(presence==='none'?'none':'possible'));el('reason').value=annotation?.reason||'';const candidates=baselineCandidates(item);const paths=new Set(candidates.map(x=>x.image_path));const chosen=annotation?.baseline_path||defaultBaseline(item);if(chosen&&!paths.has(chosen))candidates.unshift(state.all.find(x=>x.image_path===chosen));el('baseline').innerHTML=candidates.filter(Boolean).map(x=>`<option value="${escapeHtml(x.image_path)}">${escapeHtml(x.filename)}</option>`).join('');el('baseline').value=chosen;showBaseline();updateDerived();updateProgress();setMessage('Ctrl + S 保存');}
    function showBaseline(){const item=state.all.find(x=>x.image_path===el('baseline').value);el('baselineImage').src=item?.image_url||'';el('baselineName').textContent=item?.filename||'没有找到基准图，请先采集 baseline 场景';}
    function updateProgress(){el('total').textContent=state.visible.length;el('position').textContent=state.visible.length?state.index+1:0;el('completed').textContent=Object.keys(state.annotations).length;el('previous').disabled=state.index<=0;el('next').disabled=state.index>=state.visible.length-1;}
    function setMessage(text,error=false){el('message').textContent=text;el('message').classList.toggle('error',error);}
    function presenceValue(){const value=selected('hazard_present');return value==='present'?true:value==='none'?false:null;}
    function derive(){const visibility=selected('visibility');const present=presenceValue();const hazards=[...document.querySelectorAll('input[name="hazard_types"]:checked')].map(x=>x.value);const position=selected('position_zone');const occupation=selected('walkway_occupation');const lengthOccupation=selected('walkway_length_occupation');const passage=selected('passage_effect');const trip=selected('trip_risk');if(visibility==='insufficient'||present===null)return['insufficient','recheck'];if(present===false)return visibility==='limited'?['low','recheck']:['clear','record_clear'];if(['difficult','blocked'].includes(passage)||occupation==='over_half'||trip==='obvious'||hazards.length>=2)return['high','remind_resident'];if(passage==='detour'||occupation==='quarter_to_half'||(lengthOccupation==='over_half'&&passage==='narrowed')||trip==='possible'||position==='center')return['medium','create_task'];if(passage==='narrowed'||occupation==='under_quarter'||['boundary','inner_side'].includes(position)||visibility==='limited')return['low','recheck'];return['clear','record_clear'];}
    function updateDerived(){const [risk,action]=derive();el('derivedRisk').textContent=options.risk[risk];el('derivedAction').textContent=options.action[action];}
    function collect(){const item=current();return{sample_id:state.annotations[item.image_path]?.sample_id||item.sample_id,image_path:item.image_path,baseline_path:el('baseline').value,lighting:el('lighting').value,visibility:selected('visibility'),hazard_present:presenceValue(),hazard_types:[...document.querySelectorAll('input[name="hazard_types"]:checked')].map(x=>x.value),position_zone:selected('position_zone'),walkway_occupation:selected('walkway_occupation'),walkway_length_occupation:selected('walkway_length_occupation'),passage_effect:selected('passage_effect'),trip_risk:selected('trip_risk'),reason:el('reason').value.trim()};}
    async function save(moveNext){if(!el('form').reportValidity())return;const item=current();if(!item)return;setMessage('正在保存…');try{const payload=collect();const response=await fetch('/api/annotations',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await response.json();if(!response.ok)throw new Error(Array.isArray(body.detail)?body.detail[0]?.msg:body.detail||'保存失败');state.annotations[item.image_path]=body.annotation;item.annotated=true;setMessage(`已保存到 ${state.output}`);el('doneBadge').classList.add('show');if(moveNext){if(el('unlabeledOnly').checked)rebuildVisible(item.image_path);else if(state.index<state.visible.length-1){state.index++;show();}}updateProgress();}catch(error){setMessage(error.message,true);}}
    function rebuildVisible(previousPath){state.visible=el('unlabeledOnly').checked?state.all.filter(x=>!state.annotations[x.image_path]):[...state.all];const same=state.visible.findIndex(x=>x.image_path===previousPath);state.index=same>=0?same:Math.min(state.index,Math.max(0,state.visible.length-1));show();}
    async function load(){makeChoices('visibility','visibility',options.visibility);makeChoices('presence','hazard_present',options.presence);makeChoices('hazards','hazard_types',options.hazards,true);makeChoices('positionZone','position_zone',options.positionZone);makeChoices('occupation','walkway_occupation',options.occupation);makeChoices('lengthOccupation','walkway_length_occupation',options.occupation);makeChoices('passageEffect','passage_effect',options.passageEffect);makeChoices('tripRisk','trip_risk',options.tripRisk);el('lighting').innerHTML=Object.entries(options.lighting).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');const response=await fetch('/api/data');const data=await response.json();state.all=data.images;state.visible=[...data.images];state.annotations=data.annotations;state.output=data.output_path;show();}
    function applyPresence(){const value=selected('hazard_present');if(value==='none'){setSelected('hazard_types',[]);setSelected('position_zone','outside');setSelected('walkway_occupation','none');setSelected('walkway_length_occupation','none');setSelected('passage_effect','none');setSelected('trip_risk','none');}else if(value==='unknown'){setSelected('hazard_types',[]);setSelected('position_zone','unknown');setSelected('walkway_occupation','unknown');setSelected('walkway_length_occupation','unknown');setSelected('passage_effect','unknown');setSelected('trip_risk','unknown');}updateDerived();}
    el('baseline').addEventListener('change',showBaseline);el('form').addEventListener('change',updateDerived);el('presence').addEventListener('change',applyPresence);el('visibility').addEventListener('change',()=>{if(selected('visibility')==='insufficient'){setSelected('hazard_present','unknown');applyPresence();}});el('hazards').addEventListener('change',()=>{if(document.querySelector('input[name="hazard_types"]:checked'))setSelected('hazard_present','present');updateDerived();});el('unlabeledOnly').addEventListener('change',()=>rebuildVisible(current()?.image_path));el('previous').addEventListener('click',()=>{if(state.index>0){state.index--;show();}});el('next').addEventListener('click',()=>{if(state.index<state.visible.length-1){state.index++;show();}});el('save').addEventListener('click',()=>save(false));el('form').addEventListener('submit',event=>{event.preventDefault();save(true);});document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();save(false);}if(event.altKey&&event.key==='ArrowRight'){event.preventDefault();el('next').click();}if(event.altKey&&event.key==='ArrowLeft'){event.preventDefault();el('previous').click();}});load().catch(error=>setMessage(`读取失败：${error.message}`,true));
  </script>
</body>
</html>
