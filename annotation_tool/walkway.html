<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置过道区域</title>
  <style>
    :root { color-scheme:light; --ink:#17212b; --muted:#65717d; --line:#dce2e8; --accent:#1769e0; --bg:#f5f7fa; --green:#25a66a; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
    button,select { font:inherit; }
    header { height:58px; padding:0 22px; display:flex; align-items:center; gap:16px; background:#fff; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:18px; } header a { margin-left:auto; color:#0757bd; text-decoration:none; }
    main { display:grid; grid-template-columns:minmax(540px,1fr) 320px; gap:16px; padding:16px; min-height:calc(100vh - 58px); }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .stage-head { padding:12px 15px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
    .stage { min-height:620px; padding:16px; display:flex; align-items:center; justify-content:center; background:#20252b; overflow:auto; }
    canvas { display:block; max-width:100%; height:auto; cursor:crosshair; box-shadow:0 0 0 1px #444; touch-action:none; }
    aside { padding:17px; }
    label { display:block; font-weight:650; margin:0 0 7px; }
    select { width:100%; padding:9px 10px; border:1px solid #cbd4dd; border-radius:7px; background:#fff; margin-bottom:17px; }
    .guide { padding:12px 14px; margin-bottom:17px; border-radius:8px; background:#eef6ff; color:#31485f; }
    .guide ol { margin:7px 0 0; padding-left:21px; }
    .status { min-height:42px; color:var(--muted); margin:14px 0; word-break:break-all; }
    .status.error { color:#bc2525; } .saved { color:#168353; font-weight:650; }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    button { padding:9px 12px; border:1px solid #c8d2dc; border-radius:7px; background:#fff; cursor:pointer; }
    button.primary { grid-column:1/-1; color:#fff; border-color:var(--accent); background:var(--accent); }
    button:disabled { opacity:.45; cursor:default; }
    .point-count { padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .legend { margin-top:16px; color:var(--muted); font-size:12px; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--green); margin-right:5px; }
    @media (max-width:850px) { main { grid-template-columns:1fr; } .stage { min-height:360px; } }
  </style>
</head>
<body>
  <header><h1>设置过道区域</h1><span>在畅通基准图上圈出日常通行的地面范围</span><a href="/">返回图片标注</a></header>
  <main>
    <section class="card">
      <div class="stage-head"><strong id="imageName">正在读取基准图…</strong><span id="imageSize"></span></div>
      <div class="stage"><canvas id="canvas"></canvas></div>
    </section>
    <aside class="card">
      <div class="guide">沿过道边缘依次点击。最后一个点会自动连接第一个点。<ol><li>从画面底部一个角开始</li><li>沿过道边缘顺序点击</li><li>至少选择 3 个点</li><li>确认绿色区域后保存</li></ol></div>
      <label for="camera">摄像头</label><select id="camera"></select>
      <label for="baseline">畅通基准图</label><select id="baseline"></select>
      <div class="point-count">当前已选择 <strong id="pointCount">0</strong> 个边界点</div>
      <div class="buttons"><button type="button" id="undo">撤销一点</button><button type="button" id="clear">清空</button><button type="button" class="primary" id="save">保存过道区域</button></div>
      <div class="status" id="status">选择基准图后开始点击。</div>
      <div class="legend"><span class="dot"></span>绿色范围将保存为原始图片像素坐标。每台摄像头保存一组。</div>
    </aside>
  </main>
  <script>
    const state={baselines:[],walkways:{},points:[],image:null,output:''};
    const el=id=>document.getElementById(id); const canvas=el('canvas'); const ctx=canvas.getContext('2d');
    function escapeHtml(text){const node=document.createElement('div');node.textContent=text;return node.innerHTML;}
    function selectedBaseline(){return state.baselines.find(item=>item.image_path===el('baseline').value);}
    function setStatus(text,error=false){el('status').textContent=text;el('status').classList.toggle('error',error);el('status').classList.toggle('saved',!error&&text.startsWith('已保存'));}
    function populateCameras(){const cameras=[...new Set(state.baselines.map(item=>item.camera_id))];el('camera').innerHTML=cameras.map(camera=>`<option value="${escapeHtml(camera)}">${escapeHtml(camera)}</option>`).join('');if(cameras.length)selectCamera();else{setStatus('没有找到 baseline 场景的图片，请先采集畅通基准图。',true);el('save').disabled=true;}}
    function selectCamera(){const camera=el('camera').value;const images=state.baselines.filter(item=>item.camera_id===camera);el('baseline').innerHTML=images.map(item=>`<option value="${escapeHtml(item.image_path)}">${escapeHtml(item.filename)} · ${escapeHtml(item.lighting)}</option>`).join('');const saved=state.walkways[camera];if(saved&&images.some(item=>item.image_path===saved.baseline_path))el('baseline').value=saved.baseline_path;loadBaseline(true);}
    function loadBaseline(useSaved){const item=selectedBaseline();if(!item)return;const saved=state.walkways[item.camera_id];state.points=useSaved&&saved&&saved.baseline_path===item.image_path?saved.walkway_polygon.map(([x,y])=>({x,y})):[];const image=new Image();image.onload=()=>{state.image=image;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;el('imageName').textContent=item.filename;el('imageSize').textContent=`${image.naturalWidth} × ${image.naturalHeight}`;draw();setStatus(state.points.length?`已读取 ${item.camera_id} 保存的过道区域。`:'请在图片上沿过道边缘依次点击。');};image.onerror=()=>setStatus('基准图加载失败。',true);image.src=item.image_url;}
    function draw(){if(!state.image)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(state.image,0,0,canvas.width,canvas.height);if(state.points.length){ctx.beginPath();ctx.moveTo(state.points[0].x,state.points[0].y);state.points.slice(1).forEach(point=>ctx.lineTo(point.x,point.y));if(state.points.length>=3){ctx.closePath();ctx.fillStyle='rgba(30, 190, 105, .28)';ctx.fill();}ctx.strokeStyle='#25e58d';ctx.lineWidth=Math.max(2,canvas.width/380);ctx.stroke();state.points.forEach((point,index)=>{ctx.beginPath();ctx.arc(point.x,point.y,Math.max(5,canvas.width/150),0,Math.PI*2);ctx.fillStyle='#19a967';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(11,canvas.width/60)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(index+1),point.x,point.y);});}el('pointCount').textContent=state.points.length;el('undo').disabled=!state.points.length;el('clear').disabled=!state.points.length;el('save').disabled=state.points.length<3;}
    canvas.addEventListener('pointerdown',event=>{if(!state.image)return;const rect=canvas.getBoundingClientRect();const x=Math.round((event.clientX-rect.left)*canvas.width/rect.width);const y=Math.round((event.clientY-rect.top)*canvas.height/rect.height);state.points.push({x:Math.min(canvas.width-1,Math.max(0,x)),y:Math.min(canvas.height-1,Math.max(0,y))});draw();setStatus('继续沿过道边缘点击，完成后保存。');});
    el('undo').addEventListener('click',()=>{state.points.pop();draw();setStatus('已撤销最后一个点。');});
    el('clear').addEventListener('click',()=>{state.points=[];draw();setStatus('已清空，请重新点击过道边界。');});
    el('camera').addEventListener('change',selectCamera);el('baseline').addEventListener('change',()=>loadBaseline(false));
    el('save').addEventListener('click',async()=>{const item=selectedBaseline();if(!item||state.points.length<3)return;const payload={camera_id:item.camera_id,baseline_path:item.image_path,image_width:canvas.width,image_height:canvas.height,walkway_polygon:state.points.map(point=>[point.x,point.y])};setStatus('正在保存…');try{const response=await fetch('/api/walkways',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await response.json();if(!response.ok)throw new Error(Array.isArray(body.detail)?body.detail[0]?.msg:body.detail||'保存失败');state.walkways[item.camera_id]=payload;setStatus(`已保存到 ${body.output_path}`);}catch(error){setStatus(error.message,true);}});
    fetch('/api/walkways').then(response=>response.json()).then(data=>{state.baselines=data.baselines;state.walkways=data.walkways;state.output=data.output_path;populateCameras();}).catch(error=>setStatus(`读取失败：${error.message}`,true));
  </script>
</body>
</html>
