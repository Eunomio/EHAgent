name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Run product API tests
        run: python -m pytest -q 2>&1 | tee pytest-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-output
          path: pytest-output.txt
